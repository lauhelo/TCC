<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="acesso.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Meta tags geradas pelo ciaweb · ciawebsites.com.br/ferramentas-de-seo -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="O site tem a função de acessar o site ">
    <meta name="keywords" content="acesso, senha, email, recuperação">
    <meta name="author" content="laura cleveston">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="http://127.0.0.1:5500/frontend/acesso.html">
    <meta name="theme-color" content="#ff5a1f">

    <!-- Open Graph -->
    <meta property="og:title" content="Entre Laços">
    <meta property="og:description" content="O site tem a função de acessar o site ">
    <meta property="og:url" content="http://127.0.0.1:5500/frontend/acesso.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Entre Laços">
    <meta name="twitter:description" content="O site tem a função de acessar o site ">

</head>

<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">

            <div class="logo">
                <img src="logo.png" alt="logo" height="40">
                <span>Entre Laços</span>
            </div>

            <nav class="menu-links">
                <a href="index.html">Início</a>
                <a class="requer-login" href="animais.html">Animais</a>
                <a class="requer-login" href="doar.html">Doar</a>
                <a class="requer-login" href="eventos.html">Eventos</a>
                <a class="requer-login" href="historias.html">Histórias</a>
                <a class="requer-login" href="dicas.html">Dicas</a>
            </nav>

            <div class="perfil-topo">
                <a class="botao-voltar" href="index.html">Voltar ao Início</a>
            </div>

        </div>
    </header>

    <section class="secao-acesso">
        <div class="container-acesso">

            <div class="conteudo-imagem">
                <img src="https://i.pinimg.com/736x/28/ab/03/28ab03b5467e4af2ae0229b1aacf63d2.jpg" alt="Pet feliz">
            </div>

            <div class="card-acesso">
                <h2>Entrar</h2>
                <p>Acesse sua conta e continue espalhando amor</p>

                <form id="formLogin">
                    <input id="login_email" type="email" placeholder="E-mail" required>
                    <input id="login_senha" type="password" placeholder="Senha" required>
                    <button type="submit" class="botao-principal">Entrar</button>
                </form>

                <span class="link-alternar">
                    Esqueceu sua senha?
                    <a href="recusenha.html">Redefinir senha</a>
                </span>

                <span class="link-alternar">
                    Não tem conta?
                    <a href="cadastro.html">Cadastre-se</a>
                </span>
            </div>

        </div>
    </section>

    <script>
        const API_URL = "http://localhost:3000";

        function usuarioEstaLogado() {
            return !!(
                localStorage.getItem("token") ||
                sessionStorage.getItem("token")
            );
        }

        function limparDadosSessao() {
            localStorage.removeItem("token");
            localStorage.removeItem("usuario");
            localStorage.removeItem("tipoUsuario");
            localStorage.removeItem("idOngAtiva");
            localStorage.removeItem("nomeOngAtiva");
            localStorage.removeItem("nome");

            sessionStorage.removeItem("token");
            sessionStorage.removeItem("usuario");
            sessionStorage.removeItem("tipoUsuario");
            sessionStorage.removeItem("idOngAtiva");
            sessionStorage.removeItem("nomeOngAtiva");
            sessionStorage.removeItem("nome");
        }

        function configurarProtecaoLinks() {
            const linksProtegidos = document.querySelectorAll(".requer-login");

            linksProtegidos.forEach(link => {
                link.addEventListener("click", function (event) {
                    if (!usuarioEstaLogado()) {
                        event.preventDefault();

                        alert("Atenção: Você precisa estar cadastrado e logado para acessar esta página!");
                    }
                });
            });
        }

        function atualizarInterface() {
            const nomeOng = localStorage.getItem("nomeOngAtiva");
            const perfilContainer = document.querySelector(".perfil-topo");

            if (!perfilContainer) return;

            if (usuarioEstaLogado() && nomeOng) {
                perfilContainer.innerHTML = `
            <span style="color: #e67e22; font-weight: bold; margin-right: 15px;">
                ONG: ${nomeOng}
            </span>

            <a class="botao-voltar" href="#" onclick="sairDaOng()">
                Sair da ONG
            </a>
        `;
            } else {
                perfilContainer.innerHTML = `
            <a class="botao-voltar" href="index.html">
                Voltar ao Início
            </a>
        `;
            }
        }

        function sairDaOng() {
            localStorage.removeItem("idOngAtiva");
            localStorage.removeItem("nomeOngAtiva");

            sessionStorage.removeItem("idOngAtiva");
            sessionStorage.removeItem("nomeOngAtiva");

            window.location.reload();
        }

        window.addEventListener("DOMContentLoaded", () => {
            atualizarInterface();
            configurarProtecaoLinks();
        });

        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("login_email").value;
            const senha = document.getElementById("login_senha").value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.erro || "E-mail ou senha incorretos.");
                    return;
                }

                // Limpar dados de uma sessão anterior
                limparDadosSessao();

                // Salvar os dados da nova sessão
                localStorage.setItem("token", data.token);
                localStorage.setItem("tipoUsuario", data.usuario.tipo);
                localStorage.setItem("usuario", JSON.stringify(data.usuario));

                sessionStorage.setItem("nome", data.usuario.nome);

                if (data.usuario.tipo === "ong") {
                    await verificarOngsECaminhar(data.token);
                } else {
                    window.location.href = "index.html";
                }

            } catch (error) {
                console.error("Erro ao conectar:", error);
                alert("Erro ao conectar com o servidor.");
            }
        });

        async function verificarOngsECaminhar(token) {
            try {
                const resOng = await fetch(`${API_URL}/minhas-ongs`, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (resOng.status === 401) {
                    limparDadosSessao();
                    alert("Sua sessão expirou. Faça login novamente.");
                    window.location.replace("acesso.html");
                    return;
                }

                const ongs = await resOng.json();

                if (resOng.ok && Array.isArray(ongs) && ongs.length > 0) {
                    window.location.href = "escolherOng.html";
                } else {
                    window.location.href = "ong.html";
                }

            } catch (err) {
                console.error("Erro ao verificar ONGs:", err);
                window.location.href = "ong.html";
            }
        }
    </script>

</body>

</html>
